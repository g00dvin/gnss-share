name: CI

on:
  push:
    branches-ignore: []
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (debug)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    - name: Assemble debug APKs
      run: |
        BRANCH="${{ github.head_ref || github.ref_name }}"
        SHORT_SHA=$(git rev-parse --short=7 HEAD)
        export BUILD_LABEL="${BRANCH}-${SHORT_SHA}"
        echo "BUILD_LABEL=$BUILD_LABEL"
        ./gradlew assembleDebug

    - name: Collect debug APKs
      run: |
        mkdir -p artifacts
        cp client-app/build/outputs/apk/debug/*.apk artifacts/
        cp server-app/build/outputs/apk/debug/*.apk artifacts/

    # One artifact per app, each containing just the APK at the zip root (GitHub always wraps
    # artifacts in a zip; a raw .apk download is only available from a tagged Release).
    - name: Upload client debug APK
      uses: actions/upload-artifact@v4
      with:
        name: locsync-client-debug
        path: artifacts/locsync-client-*-debug.apk
        if-no-files-found: error
        retention-days: 14

    - name: Upload server debug APK
      uses: actions/upload-artifact@v4
      with:
        name: locsync-server-debug
        path: artifacts/locsync-server-*-debug.apk
        if-no-files-found: error
        retention-days: 14
